[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab-ibkr"
version = "0.1.0"
description = "Event-driven backtesting and IBKR trading of quantlab strategies on NautilusTrader."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "quantlab",
    "nautilus-trader>=1.231.0,<2",  # latest stable; 2.0 is still a release candidate
    # The IB adapter's client (the live venue, ADR 0010). Pinned as nautilus's
    # `ib` extra pins it, but not through that extra: it also pins
    # protobuf==5.29.6, which would move the protobuf quantlab keeps at 7.
    # ibapi's generated protobuf modules import cleanly on 7.
    "nautilus-ibapi==10.45.1",
]

[project.scripts]
quantlab-ibkr = "quantlab_ibkr.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
quantlab = { path = "../quantlab", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["quantlab_ibkr*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
# The docstrings' Examples run as doctests beside the tests.
testpaths = ["tests", "quantlab_ibkr"]
addopts = ["--doctest-modules"]
doctest_optionflags = ["ELLIPSIS"]
# A test that runs past this many seconds dumps every thread's stack and ends
# the run, so a deadlock in native code fails instead of hanging.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true
