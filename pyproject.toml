[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab-trader"
version = "0.1.0"
description = "Event-driven backtesting and live trading of quantlab strategies on NautilusTrader."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "quantlab",
    "nautilus-trader>=1.231.0,<2",  # latest stable; 2.0 is still a release candidate
]

[project.scripts]
quantlab-trader = "quantlab_trader.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
quantlab = { path = "../quantlab", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["quantlab_trader*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# A test that runs past this many seconds dumps every thread's stack and ends
# the run, so a deadlock in native code fails instead of hanging.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true
